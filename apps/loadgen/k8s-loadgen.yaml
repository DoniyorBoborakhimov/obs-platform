apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: banking
spec:
  replicas: 1
  selector:
    matchLabels: { app: loadgen }
  template:
    metadata:
      labels: { app: loadgen }
    spec:
      containers:
        - name: loadgen
          image: python:3.12-slim
          env:
            - name: RPS
              value: "20"
          command: ["python", "-c"]
          args:
            - |
              import random, threading, time, urllib.request, os
              BASE = "http://payment-api.banking.svc.cluster.local:8000"
              RPS = int(os.getenv("RPS", "20"))
              def hit():
                  try:
                      if random.random() < 0.6:
                          urllib.request.urlopen(f"{BASE}/balance/{random.randint(1000,9999)}", timeout=5)
                      else:
                          urllib.request.urlopen(urllib.request.Request(f"{BASE}/payment", method="POST", data=b""), timeout=5)
                  except Exception:
                      pass
              while True:
                  for _ in range(RPS):
                      threading.Thread(target=hit, daemon=True).start()
                  time.sleep(1)
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
