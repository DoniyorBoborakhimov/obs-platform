---
- name: Проверить, существует ли кластер
  ansible.builtin.command: k3d cluster list -o json
  register: k3d_clusters
  changed_when: false
  check_mode: false

- name: Создать кластер из конфига
  ansible.builtin.command: >-
    k3d cluster create --config {{ playbook_dir }}/../clusters/obs-lab.yaml
  when: cluster_name not in (k3d_clusters.stdout | from_json | map(attribute='name') | list)
  changed_when: true

- name: Дождаться готовности нод
  ansible.builtin.command: kubectl wait --for=condition=Ready nodes --all --timeout=180s
  changed_when: false
  check_mode: false

- name: Показать состояние кластера
  ansible.builtin.command: kubectl get nodes -o wide
  register: nodes_out
  changed_when: false
  check_mode: false

- name: Вывести ноды
  ansible.builtin.debug:
    msg: "{{ nodes_out.stdout_lines }}"
